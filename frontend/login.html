<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Shaik Hafijulrehaman Portfolio</title>
    
    <!-- Dynamic Favicon -->
    <link id="dynamic-favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230f172a'/%3E%3Ctext y='.78em' x='50%25' font-size='60' text-anchor='middle'%3E⚙️%3C/text%3E%3C/svg%3E">
    <script src="config.js"></script>
    <script>
        fetch('/api/settings')
            .then(res => res.json())
            .then(data => {
                if (data.admin_favicon_url) {
                    document.getElementById('dynamic-favicon').href = data.admin_favicon_url;
                }
            })
            .catch(err => console.error('Error loading admin favicon:', err));
    </script>

    <!-- CSS Stylesheets -->
    <link rel="stylesheet" href="style.css">
    
    <!-- CDN Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: rgba(17, 24, 39, 0.6);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4), 0 0 30px rgba(37, 99, 235, 0.15);
            text-align: center;
            z-index: 10;
        }
        
        .login-header {
            margin-bottom: 35px;
        }
        
        .login-header i {
            font-size: 44px;
            color: var(--accent);
            margin-bottom: 15px;
            filter: drop-shadow(0 0 8px var(--glow-hover));
        }
        
        .login-header h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            letter-spacing: 1px;
            color: var(--white);
        }
        
        .login-header h2 span {
            color: var(--accent);
        }
        
        .form-group {
            margin-bottom: 22px;
            text-align: left;
            position: relative;
        }
        
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--accent);
            margin-bottom: 8px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: var(--white);
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.04);
            box-shadow: 0 0 15px rgba(96, 165, 250, 0.2);
        }
        
        .form-group i.input-icon {
            position: absolute;
            left: 15px;
            bottom: 14px;
            color: var(--text-muted);
            font-size: 16px;
        }
        
        .btn-login {
            width: 100%;
            height: 48px;
            background: var(--primary);
            border: none;
            color: var(--white);
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.2);
        }
        
        .btn-login:hover {
            background: var(--accent);
            color: var(--bg);
            box-shadow: 0 0 20px rgba(96, 165, 250, 0.4);
            transform: translateY(-2px);
        }
        
        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #EF4444;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 22px;
            display: none;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }
        
        .error-message.active {
            display: flex;
        }
        
        .back-to-site {
            margin-top: 25px;
            display: inline-block;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            transition: color 0.3s;
        }
        
        .back-to-site:hover {
            color: var(--accent);
        }
    </style>
</head>
<body>

    <!-- Spotlight Cursor Glow -->
    <div class="cursor-glow" id="cursor-glow" style="display: block;"></div>

    <div class="login-card">
        <div class="login-header">
            <i class="fa-solid fa-shield-halved"></i>
            <h2><span>admin</span>panel</h2>
        </div>
        
        <!-- Error Alert -->
        <div class="error-message" id="error-box">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span id="error-text">Invalid login credentials</span>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Admin Email</label>
                <i class="fa-solid fa-envelope input-icon"></i>
                <input type="email" id="email" placeholder="admin@email.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn-login" id="btn-submit">
                <span id="btn-text">Sign In</span>
                <i class="fa-solid fa-arrow-right-to-bracket" style="margin-left: 8px;"></i>
            </button>
        </form>
        
        <a href="index.html" class="back-to-site"><i class="fa-solid fa-arrow-left"></i> Back to Portfolio</a>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Cursor spotlight tracker
            const cursorGlow = document.getElementById('cursor-glow');
            document.addEventListener('mousemove', (e) => {
                cursorGlow.style.left = e.clientX + 'px';
                cursorGlow.style.top = e.clientY + 'px';
            });

            const loginForm = document.getElementById('login-form');
            const errorBox = document.getElementById('error-box');
            const errorText = document.getElementById('error-text');
            const btnSubmit = document.getElementById('btn-submit');
            const btnText = document.getElementById('btn-text');

            // Redirect if already logged in (verify token validity)
            const token = localStorage.getItem("admin_token");
            if (token) {
                fetch('/api/auth/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                }).then(res => {
                    if (res.ok) window.location.href = "admin.html";
                });
            }

            loginForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                errorBox.classList.remove('active');
                
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;

                // Set loading status
                btnSubmit.disabled = true;
                btnText.textContent = "Authenticating...";

                try {
                    const res = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    const data = await res.json();

                    if (!res.ok) {
                        throw new Error(data.error || "Authentication failed.");
                    }

                    // Save token and redirect
                    localStorage.setItem("admin_token", data.token);
                    window.location.href = "admin.html";
                } catch (err) {
                    console.error("Login error:", err);
                    errorText.textContent = err.message || "Authentication failed.";
                    errorBox.classList.add('active');
                } finally {
                    btnSubmit.disabled = false;
                    btnText.textContent = "Sign In";
                }
            });
        });
    </script>
</body>
</html>

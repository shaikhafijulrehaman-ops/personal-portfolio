<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Shaik Hafijulrehaman Portfolio</title>
    
    <!-- Dynamic Favicon -->
    <link id="dynamic-favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230f172a'/%3E%3Ctext y='.78em' x='50%25' font-size='60' text-anchor='middle'%3E⚙️%3C/text%3E%3C/svg%3E">
    <script src="config.js"></script>
    <script>
        fetch('/api/settings')
            .then(res => res.json())
            .then(data => {
                if (data.admin_favicon_url) {
                    document.getElementById('dynamic-favicon').href = data.admin_favicon_url;
                }
            })
            .catch(err => console.error('Error loading admin favicon:', err));
    </script>

    <!-- CSS Stylesheets -->
    <link rel="stylesheet" href="style.css">
    
    <!-- CDN Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: rgba(17, 24, 39, 0.6);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4), 0 0 30px rgba(37, 99, 235, 0.15);
            text-align: center;
            z-index: 10;
        }
        
        .login-header {
            margin-bottom: 35px;
        }
        
        .login-header i {
            font-size: 44px;
            color: var(--accent);
            margin-bottom: 15px;
            filter: drop-shadow(0 0 8px var(--glow-hover));
        }
        
        .login-header h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            letter-spacing: 1px;
            color: #ffffff;
        }
        
        .login-header h2 span {
            color: #3b82f6;
        }
        
        .form-group {
            margin-bottom: 22px;
            text-align: left;
            position: relative;
        }
        
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #3b82f6;
            margin-bottom: 8px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #ffffff;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #3b82f6;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 15px rgba(96, 165, 250, 0.3);
        }
        
        .form-group i.input-icon {
            position: absolute;
            left: 15px;
            bottom: 14px;
            color: #94a3b8;
            font-size: 16px;
        }
        
        .btn-login {
            width: 100%;
            height: 48px;
            background: #2563eb;
            border: none;
            color: #ffffff;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.2);
        }
        
        .btn-login:hover {
            background: #3b82f6;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(96, 165, 250, 0.4);
            transform: translateY(-2px);
        }
        
        .error-message {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fecaca;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 22px;
            display: none;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }
        
        .error-message.active {
            display: flex;
        }
        
        .back-to-site {
            margin-top: 25px;
            display: inline-block;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            transition: color 0.3s;
        }
        
        .back-to-site:hover {
            color: var(--accent);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Fullscreen Recovery Loader Overlay -->
    <div id="session-recovery-loader" style="display: none; position: fixed; top:0; left:0; width:100vw; height:100vh; background: #0b0f19; z-index: 99999; flex-direction: column; align-items: center; justify-content: center; gap: 20px;">
        <div class="loader-spinner" style="width: 50px; height: 50px; border: 3px solid rgba(255,255,255,0.05); border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <p style="color: #94a3b8; font-size: 14px; font-weight: 500; font-family: 'Inter', sans-serif;">Restoring your session...</p>
    </div>

    <!-- Spotlight Cursor Glow -->
    <div class="cursor-glow" id="cursor-glow" style="display: block;"></div>

    <div class="login-card">
        <div class="login-header">
            <i class="fa-solid fa-shield-halved"></i>
            <h2><span>admin</span>panel</h2>
        </div>
        
        <!-- Error Alert -->
        <div class="error-message" id="error-box">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span id="error-text">Invalid login credentials</span>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Admin Email</label>
                <i class="fa-solid fa-envelope input-icon"></i>
                <input type="email" id="email" placeholder="admin@email.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn-login" id="btn-submit">
                <span id="btn-text">Sign In</span>
                <i class="fa-solid fa-arrow-right-to-bracket" style="margin-left: 8px;"></i>
            </button>
        </form>
        
        <a href="index.html" class="back-to-site"><i class="fa-solid fa-arrow-left"></i> Back to Portfolio</a>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Cursor spotlight tracker
            const cursorGlow = document.getElementById('cursor-glow');
            document.addEventListener('mousemove', (e) => {
                cursorGlow.style.left = e.clientX + 'px';
                cursorGlow.style.top = e.clientY + 'px';
            });

            const loginForm = document.getElementById('login-form');
            const errorBox = document.getElementById('error-box');
            const errorText = document.getElementById('error-text');
            const btnSubmit = document.getElementById('btn-submit');
            const btnText = document.getElementById('btn-text');

            // Redirect if already logged in (verify token validity)
            const token = localStorage.getItem("admin_token");
            if (token) {
                const recoveryLoader = document.getElementById('session-recovery-loader');
                if (recoveryLoader) recoveryLoader.style.display = 'flex';
                
                fetch('/api/auth/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                }).then(res => {
                    const contentType = res.headers.get("content-type");
                    if (res.ok && contentType && contentType.includes("application/json")) {
                        window.location.href = "admin.html";
                    } else {
                        if (recoveryLoader) recoveryLoader.style.display = 'none';
                        localStorage.removeItem("admin_token");
                    }
                }).catch(err => {
                    console.error("Verify token error:", err);
                    if (recoveryLoader) recoveryLoader.style.display = 'none';
                });
            }

            // Real-time input validation
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            
            function validateInputs() {
                const email = emailInput.value.trim();
                const password = passwordInput.value;
                const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
                const passwordValid = password.length >= 6;
                
                if (email && !emailValid) {
                    emailInput.style.borderColor = 'rgba(239, 68, 68, 0.5)';
                } else if (emailValid) {
                    emailInput.style.borderColor = 'rgba(34, 197, 94, 0.5)';
                } else {
                    emailInput.style.borderColor = '';
                }
                
                if (password && !passwordValid) {
                    passwordInput.style.borderColor = 'rgba(239, 68, 68, 0.5)';
                } else if (passwordValid) {
                    passwordInput.style.borderColor = 'rgba(34, 197, 94, 0.5)';
                } else {
                    passwordInput.style.borderColor = '';
                }
            }
            
            emailInput.addEventListener('input', validateInputs);
            passwordInput.addEventListener('input', validateInputs);

            loginForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                errorBox.classList.remove('active');
                
                const email = emailInput.value.trim();
                const password = passwordInput.value;

                // Validate before submission
                const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
                if (!emailValid) {
                    errorText.textContent = "Please enter a valid email address.";
                    errorBox.classList.add('active');
                    return;
                }
                if (password.length < 6) {
                    errorText.textContent = "Password must be at least 6 characters long.";
                    errorBox.classList.add('active');
                    return;
                }

                // Set loading status
                btnSubmit.disabled = true;
                btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin" style="margin-right: 8px;"></i> Authenticating...';

                try {
                    const res = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    
                    let data;
                    const contentType = res.headers.get("content-type");
                    if (contentType && contentType.includes("application/json")) {
                        data = await res.json();
                    } else {
                        throw new Error("Could not connect to the backend server. Please verify your backend Render URL in frontend/config.js.");
                    }

                    if (!res.ok) {
                        throw new Error(data.error || "Authentication failed.");
                    }

                    // Save token and redirect
                    localStorage.setItem("admin_token", data.token);
                    window.location.href = "admin.html";
                } catch (err) {
                    console.error("Login error:", err);
                    errorText.textContent = err.message || "Authentication failed.";
                    errorBox.classList.add('active');
                    btnSubmit.disabled = false;
                    btnSubmit.innerHTML = 'Sign In <i class="fa-solid fa-arrow-right-to-bracket" style="margin-left: 8px;"></i>';
                }
            });
        });
    </script>
</body>
</html>
